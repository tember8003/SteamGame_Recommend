name: Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'electron/**'
      - 'frontend/**'
      - 'ml/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'electron/**'
      - 'frontend/**'
      - 'ml/**'
  workflow_dispatch:

# PR 테스트가 배포 대기열을 막지 않게 PR 은 브랜치별 그룹으로 나누고, 새 커밋이 오면 이전 실행을 취소함
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # 윈도우에서 커밋한 gradlew 는 CRLF 라 셔뱅이 깨지므로 Dockerfile 과 같이 LF 로 바꾸고 실행 권한을 줌
      - run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      # Testcontainers 가 러너의 Docker 로 Postgres 를 띄움
      - run: ./gradlew --no-daemon test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

  # 외부 Action 은 태그가 바꿔치기돼도 영향받지 않게 커밋으로 고정함, 이 작업은 배포될 이미지를 만들어 올림
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/recommend
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      # 서버 SSH 키를 받는 외부 Action 이라 바뀔 수 있는 태그 대신 커밋으로 고정함
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/steam-recommend
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
