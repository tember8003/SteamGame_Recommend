<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Steam Game Recommend</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-card: #1e1e2e;
            --border: #333344;
            --border-hover: #4a4a6a;
            --text-primary: #ffffff;
            --text-secondary: #b4b4c8;
            --text-muted: #8b8ba3;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow: rgba(0, 0, 0, 0.3);
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            --gradient-secondary: linear-gradient(135deg, #7c3aed 0%, #f59e0b 100%);
            --gradient-card: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-primary);
            background-image:
                    radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 40% 40%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-element {
            position: absolute;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
            color: var(--primary);
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            font-size: 3rem;
        }

        .floating-element:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 2s;
            font-size: 2.5rem;
            color: var(--secondary);
        }

        .floating-element:nth-child(3) {
            bottom: 25%;
            left: 20%;
            animation-delay: 4s;
            font-size: 2rem;
            color: var(--accent);
        }

        .floating-element:nth-child(4) {
            top: 60%;
            right: 25%;
            animation-delay: 1s;
            font-size: 2.2rem;
            color: var(--success);
        }

        .floating-element:nth-child(5) {
            bottom: 15%;
            right: 10%;
            animation-delay: 3s;
            font-size: 1.8rem;
            color: var(--primary);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        .loading-container {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 600px;
            padding: 60px 40px;
            background: var(--gradient-card);
            border-radius: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px var(--shadow);
        }

        .loading-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            background: var(--gradient-primary);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }

        .loading-title {
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            }
            to {
                text-shadow: 0 0 40px rgba(0, 212, 255, 0.5), 0 0 60px rgba(124, 58, 237, 0.3);
            }
        }

        .loading-subtitle {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 500;
        }

        .loading-status {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            min-height: 1.5em;
            font-weight: 400;
        }

        .spinner-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid var(--border);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            position: relative;
        }

        .spinner::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 4px solid transparent;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite reverse;
        }

        .spinner::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 2px solid transparent;
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px;
            background: var(--bg-secondary);
            border-radius: 50px;
            padding: 4px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            height: 8px;
            background: var(--gradient-primary);
            border-radius: 50px;
            width: 0%;
            animation: progress 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 75%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .loading-steps {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding: 0 20px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .step.active {
            color: var(--primary);
            opacity: 1;
        }

        .step.completed {
            color: var(--success);
            opacity: 1;
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .step.active .step-icon {
            background: var(--primary);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .step.completed .step-icon {
            background: var(--success);
            color: var(--bg-primary);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.6;
            animation: particle-float 4s ease-in-out infinite;
        }

        .particle:nth-child(2n) {
            background: var(--secondary);
            animation-delay: 1s;
        }

        .particle:nth-child(3n) {
            background: var(--accent);
            animation-delay: 2s;
        }

        @keyframes particle-float {
            0%, 100% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10px) translateX(50px);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .loading-container {
                margin: 20px;
                padding: 40px 30px;
                border-radius: 20px;
            }

            .loading-title {
                font-size: 2.2rem;
            }

            .loading-subtitle {
                font-size: 1.1rem;
            }

            .spinner {
                width: 60px;
                height: 60px;
            }

            .loading-steps {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .step {
                flex-direction: row;
                gap: 12px;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="floating-elements">
    <i class="fas fa-gamepad floating-element"></i>
    <i class="fas fa-trophy floating-element"></i>
    <i class="fas fa-star floating-element"></i>
    <i class="fas fa-cogs floating-element"></i>
    <i class="fas fa-rocket floating-element"></i>
</div>

<div class="particles">
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 20%; animation-delay: 0.5s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 1s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 1.5s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 60%; animation-delay: 2.5s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 3s;"></div>
    <div class="particle" style="left: 80%; animation-delay: 3.5s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 4s;"></div>
</div>

<div class="loading-container fade-in">
    <h1 class="loading-title">
        <i class="fas fa-gamepad"></i>
        Game Recommend
    </h1>
    <p class="loading-subtitle">AI-Powered Game Recommendation System</p>

    <div class="spinner-container">
        <div class="spinner"></div>
    </div>

    <p class="loading-status" id="status">Initializing server...</p>

    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

    <div class="loading-steps">
        <div class="step active" id="step1">
            <div class="step-icon">
                <i class="fas fa-play"></i>
            </div>
            <span>Starting</span>
        </div>
        <div class="step" id="step2">
            <div class="step-icon">
                <i class="fas fa-database"></i>
            </div>
            <span>Loading Data</span>
        </div>
        <div class="step" id="step3">
            <div class="step-icon">
                <i class="fas fa-network-wired"></i>
            </div>
            <span>Connecting</span>
        </div>
        <div class="step" id="step4">
            <div class="step-icon">
                <i class="fas fa-check"></i>
            </div>
            <span>Ready</span>
        </div>
    </div>
</div>

<script>
    const statusElement = document.getElementById('status');
    const steps = document.querySelectorAll('.step');

    const statusMessages = [
        'Initializing server...',
        'Loading game database...',
        'Starting recommendation engine...',
        'Preparing AI models...',
        'Establishing connections...',
        'Optimizing performance...',
        'Finalizing setup...',
        'Almost ready...',
        'Loading complete!'
    ];

    const stepMessages = [
        'Starting server components',
        'Loading Steam game database',
        'Establishing server connection',
        'Application ready to use'
    ];

    let messageIndex = 0;
    let stepIndex = 0;
    let dots = 0;

    // Status message rotation
    const updateStatus = () => {
        const baseMessage = statusMessages[messageIndex % statusMessages.length];
        const dotsStr = '.'.repeat(dots);
        statusElement.textContent = baseMessage + dotsStr;

        dots = (dots + 1) % 4;
        messageIndex++;
    };

    // Step progression
    const updateStep = () => {
        if (stepIndex < steps.length) {
            // Mark current step as completed
            if (stepIndex > 0) {
                steps[stepIndex - 1].classList.remove('active');
                steps[stepIndex - 1].classList.add('completed');
                steps[stepIndex - 1].querySelector('.step-icon').innerHTML = '<i class="fas fa-check"></i>';
            }

            // Activate next step
            if (stepIndex < steps.length) {
                steps[stepIndex].classList.add('active');
            }

            stepIndex++;
        }
    };

    // Start animations
    setInterval(updateStatus, 800);

    // Update steps every 3 seconds
    setInterval(updateStep, 3000);

    // Add some dynamic particles
    const particlesContainer = document.querySelector('.particles');

    setInterval(() => {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
        particlesContainer.appendChild(particle);

        // Remove particle after animation
        setTimeout(() => {
            if (particle.parentNode) {
                particle.parentNode.removeChild(particle);
            }
        }, 5000);
    }, 500);

    // Add entrance animation
    window.addEventListener('load', () => {
        document.querySelector('.loading-container').style.animation = 'fadeInUp 0.8s ease forwards';
    });
</script>
</body>
</html>
