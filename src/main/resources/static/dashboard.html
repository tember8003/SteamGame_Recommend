<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Personal Game Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #00d4ff;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: #1e1e2e;
            --border: #333344;
            --text-primary: #ffffff;
            --text-secondary: #b4b4c8;
            --text-muted: #8b8ba3;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            --gradient-card: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-primary);
            background-image:
                    radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .search-section {
            background: var(--gradient-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-input input {
            flex: 1;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .search-input input::placeholder {
            color: var(--text-muted);
        }

        .search-input button {
            background: var(--gradient-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: var(--gradient-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .card-header i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: var(--primary);
            color: var(--bg-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .game-image {
            width: 60px;
            height: 34px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border);
        }

        .game-info {
            flex: 1;
        }

        .game-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .game-playtime {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 60px 20px;
            background: var(--gradient-card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .error-message i {
            font-size: 3rem;
            color: var(--error);
            margin-bottom: 20px;
        }

        .wide-card {
            grid-column: 1 / -1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: 10px;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .status-warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-private {
            background: rgba(139, 139, 163, 0.2);
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .search-input {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> Steam Game Dashboard</h1>
        <p class="subtitle">Analyze your gaming preferences at a glance</p>
    </div>

    <div class="search-section">
        <div class="search-input">
            <input type="text" id="steamIdInput" placeholder="Enter your Steam ID (17 digits)" value=""/>
            <button onclick="loadDashboard()">
                <i class="fas fa-search"></i>
                Load Dashboard
            </button>
        </div>
        <div style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-muted);">
            Example: 76561198364007282
        </div>
    </div>

    <div id="dashboard-content">
        <div class="loading">
            <div class="spinner"></div>
            <h3>Please enter your Steam ID</h3>
            <p>We'll create a personalized dashboard for you</p>
        </div>
    </div>
</div>

<script>
    const baseUrl = '';
    let currentSteamId = '';

    async function loadDashboard() {
        const steamId = document.getElementById('steamIdInput').value.trim();

        if (!steamId) {
            alert('Please enter your Steam ID');
            return;
        }

        if (!/^\d{17}$/.test(steamId)) {
            alert('Steam ID must be exactly 17 digits');
            return;
        }

        currentSteamId = steamId;
        showLoading();

        try {
            const response = await fetch(`${baseUrl}/api/dashboard/${steamId}`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: Failed to load dashboard`);
            }

            const data = await response.json();
            console.log('Dashboard data received:', data);
            renderDashboard(data);

        } catch (error) {
            console.error('Dashboard load error:', error);
            showError(error.message);
        }
    }

    function showLoading() {
        document.getElementById('dashboard-content').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <h3>Creating your dashboard...</h3>
                <p>Fetching your Steam data, please wait...</p>
            </div>
        `;
    }

    function showError(message = 'Unknown error occurred') {
        document.getElementById('dashboard-content').innerHTML = `
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Unable to load dashboard</h3>
                <p style="margin-bottom: 15px;">${message}</p>
                <p>Please check your Steam ID and try again later</p>
                <button onclick="loadDashboard()" style="margin-top: 20px; padding: 10px 20px; background: var(--primary); border: none; border-radius: 8px; color: var(--bg-primary); cursor: pointer;">
                    Retry
                </button>
            </div>
        `;
    }

    function renderDashboard(data) {
        const content = document.getElementById('dashboard-content');

        if (!data || !data.profileSummary) {
            showError('Invalid dashboard data received from server');
            return;
        }

        // 상태 확인
        const favoriteGenre = data.profileSummary.favoriteGenre || 'None';
        const isError = ['Error', 'Private', 'Not Found', 'Rate Limited', 'DB Error', 'Cache Error'].includes(favoriteGenre);

        content.innerHTML = `
            <div class="dashboard-grid">
                <!-- Profile Summary -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-user"></i>
                        <h3>Profile Summary</h3>
                        ${getStatusBadge(favoriteGenre)}
                    </div>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value">${data.profileSummary.totalGames || 0}</div>
                            <div class="stat-label">Total Games</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${(data.profileSummary.totalPlaytime || 0).toFixed(1)}h</div>
                            <div class="stat-label">Total Playtime</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.profileSummary.gamesPlayedRecently || 0}</div>
                            <div class="stat-label">Recently Played</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${(data.profileSummary.averagePlaytimePerGame || 0).toFixed(1)}h</div>
                            <div class="stat-label">Average Playtime</div>
                        </div>
                    </div>
                    <div style="margin-top: 20px; text-align: center; color: var(--text-secondary);">
                        <strong>Favorite Genre: ${favoriteGenre}</strong>
                    </div>
                </div>

                <!-- Recent 2 Weeks Activity -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-clock"></i>
                        <h3>Recent Activity (2 weeks)</h3>
                    </div>
                    ${renderRecentActivity(data.recentActivity)}
                </div>

                <!-- Preferred Tags -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-tags"></i>
                        <h3>Preferred Tags</h3>
                    </div>
                    ${renderTagPreferences(data.topTags)}
                </div>

                <!-- Genre Distribution -->
                <div class="dashboard-card wide-card">
                    <div class="card-header">
                        <i class="fas fa-chart-pie"></i>
                        <h3>Genre Distribution</h3>
                    </div>
                    ${renderGenreDistribution(data.genreDistribution)}
                </div>

                <!-- Library Statistics -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-gamepad"></i>
                        <h3>Library Analysis</h3>
                    </div>
                    ${renderLibraryStats(data.libraryStats)}
                </div>

                <!-- Most Played Games -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-trophy"></i>
                        <h3>Most Played Games</h3>
                    </div>
                    ${renderTopGames(data.libraryStats?.topPlayedGames)}
                </div>

                <!-- Recently Played Games -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-history"></i>
                        <h3>Recently Played</h3>
                    </div>
                    ${renderRecentGames(data.libraryStats?.recentlyPlayedGames)}
                </div>
            </div>
        `;

        // 차트 렌더링
        setTimeout(() => {
            if (data.genreDistribution && data.genreDistribution.length > 0) {
                renderGenreChart(data.genreDistribution);
            }
        }, 100);
    }

    function getStatusBadge(favoriteGenre) {
        switch (favoriteGenre) {
            case 'Private':
                return '<span class="status-badge status-private">Private Profile</span>';
            case 'Rate Limited':
                return '<span class="status-badge status-warning">Rate Limited</span>';
            case 'Error':
            case 'DB Error':
            case 'Cache Error':
                return '<span class="status-badge status-error">Error</span>';
            case 'Not Found':
                return '<span class="status-badge status-error">User Not Found</span>';
            default:
                return '';
        }
    }

    function renderRecentActivity(recentActivity) {
        if (!recentActivity) {
            return '<div class="empty-state"><i class="fas fa-clock"></i><p>No recent activity data</p></div>';
        }

        return `
            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-value">${(recentActivity.totalPlaytime || 0).toFixed(1)}h</div>
                    <div class="stat-label">Total Hours</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${recentActivity.activeGamesCount || 0}</div>
                    <div class="stat-label">Active Games</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${(recentActivity.averageSessionTime || 0).toFixed(1)}h</div>
                    <div class="stat-label">Avg Session</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${recentActivity.mostPlayedGame ? '🎮' : '❌'}</div>
                    <div class="stat-label">Most Played</div>
                </div>
            </div>
            ${recentActivity.mostPlayedGame ? `
                <div style="margin-top: 20px; padding: 15px; background: var(--bg-secondary); border-radius: 12px;">
                    <div class="game-name">${recentActivity.mostPlayedGame.name}</div>
                    <div class="game-playtime">${recentActivity.mostPlayedGame.playtimeHours.toFixed(1)} hours recently</div>
                </div>
            ` : ''}
        `;
    }

    function renderTagPreferences(topTags) {
        if (!topTags || topTags.length === 0) {
            return '<div class="empty-state"><i class="fas fa-tags"></i><p>No gaming preferences detected yet.<br>Play some games to see your preferences!</p></div>';
        }

        return `
            <div class="tag-list">
                ${topTags.slice(0, 8).map(tag => `
                    <span class="tag">${tag.tagName} (${tag.gameCount})</span>
                `).join('')}
            </div>
            <div style="margin-top: 20px;">
                <div style="margin-bottom: 10px;">
                    <strong>Top Preference: ${topTags[0].tagName}</strong>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(100, topTags[0].preferenceScore || 0)}%"></div>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">
                        ${topTags[0].gameCount} games, ${topTags[0].totalPlaytime.toFixed(1)} hours
                    </div>
                </div>
            </div>
        `;
    }

    function renderGenreDistribution(genreDistribution) {
        if (!genreDistribution || genreDistribution.length === 0) {
            return '<div class="empty-state"><i class="fas fa-chart-pie"></i><p>No genre distribution data available</p></div>';
        }

        return '<div class="chart-container"><canvas id="genreChart"></canvas></div>';
    }

    function renderLibraryStats(libraryStats) {
        if (!libraryStats) {
            return '<div class="empty-state"><i class="fas fa-gamepad"></i><p>No library statistics available</p></div>';
        }

        return `
            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-value">${libraryStats.neverPlayed || 0}</div>
                    <div class="stat-label">Never Played</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${libraryStats.shortPlayed || 0}</div>
                    <div class="stat-label">Short Play (&lt;2h)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${libraryStats.mediumPlayed || 0}</div>
                    <div class="stat-label">Medium Play (2-10h)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${libraryStats.longPlayed || 0}</div>
                    <div class="stat-label">Long Play (&gt;10h)</div>
                </div>
            </div>
        `;
    }

    function renderTopGames(topGames) {
        if (!topGames || topGames.length === 0) {
            return '<div class="empty-state"><i class="fas fa-trophy"></i><p>No played games found</p></div>';
        }

        return `
            <div class="game-list">
                ${topGames.slice(0, 5).map((game, index) => `
                    <div class="game-item">
                        <div style="width: 20px; text-align: center; color: var(--primary); font-weight: bold;">
                            ${index + 1}
                        </div>
                        <img src="${game.headerImage || ''}" alt="${game.name}" class="game-image"
                             onerror="this.style.display='none'">
                        <div class="game-info">
                            <div class="game-name">${game.name}</div>
                            <div class="game-playtime">${game.playtimeHours.toFixed(1)} hours total</div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderRecentGames(recentGames) {
        if (!recentGames || recentGames.length === 0) {
            return '<div class="empty-state"><i class="fas fa-history"></i><p>No recently played games found</p></div>';
        }

        return `
            <div class="game-list">
                ${recentGames.slice(0, 5).map(game => `
                    <div class="game-item">
                        <img src="${game.headerImage || ''}" alt="${game.name}" class="game-image"
                             onerror="this.style.display='none'">
                        <div class="game-info">
                            <div class="game-name">${game.name}</div>
                            <div class="game-playtime">${game.playtimeHours.toFixed(1)} hours total</div>
                            ${game.lastPlayedDate ? `<div style="font-size: 0.8rem; color: var(--text-muted);">Last played: ${game.lastPlayedDate}</div>` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderGenreChart(genreData) {
        const ctx = document.getElementById('genreChart');
        if (!ctx) return;

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: genreData.map(item => item.genre),
                datasets: [{
                    data: genreData.map(item => item.percentage),
                    backgroundColor: genreData.map(item => item.color),
                    borderWidth: 2,
                    borderColor: '#1a1a2e'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#b4b4c8',
                            padding: 20,
                            usePointStyle: true,
                            generateLabels: function(chart) {
                                const original = Chart.defaults.plugins.legend.labels.generateLabels;
                                const labels = original.call(this, chart);

                                labels.forEach((label, index) => {
                                    const data = genreData[index];
                                    if (data) {
                                        label.text = `${data.tagName} (${data.gameCount} games)`;
                                    }
                                });

                                return labels;
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const data = genreData[context.dataIndex];
                                return `${data.tagName}: ${data.percentage.toFixed(1)}% (${data.gameCount} games)`;
                            }
                        }
                    }
                }
            }
        });
    }

    // Enter key support
    document.getElementById('steamIdInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            loadDashboard();
        }
    });

    // Page load animation
    window.addEventListener('load', () => {
        setTimeout(() => {
            const elements = document.querySelectorAll('.dashboard-card');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.6s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }, 100);
    });
</script>
</body>
</html>
