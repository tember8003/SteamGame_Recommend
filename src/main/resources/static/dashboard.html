<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Personal Game Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #00d4ff;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: #1e1e2e;
            --border: #333344;
            --text-primary: #ffffff;
            --text-secondary: #b4b4c8;
            --text-muted: #8b8ba3;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            --gradient-card: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-primary);
            background-image:
                    radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .search-section {
            background: var(--gradient-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-input input {
            flex: 1;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .search-input button {
            background: var(--gradient-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: var(--gradient-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .card-header i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: var(--primary);
            color: var(--bg-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .game-image {
            width: 60px;
            height: 34px;
            border-radius: 8px;
            object-fit: cover;
        }

        .game-info {
            flex: 1;
        }

        .game-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .game-playtime {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .insight-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .insight-item {
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .insight-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .insight-description {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .insight-action {
            display: inline-block;
            background: var(--primary);
            color: var(--bg-primary);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .insight-action:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 60px 20px;
            background: var(--gradient-card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .error-message i {
            font-size: 3rem;
            color: var(--error);
            margin-bottom: 20px;
        }

        .wide-card {
            grid-column: 1 / -1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> Game Dashboard</h1>
        <p class="subtitle">Analyze your gaming preferences at a glance</p>
    </div>

    <div class="search-section">
        <div class="search-input">
            <input type="text" id="steamIdInput" placeholder="Enter your Steam ID" value=""/>
            <button onclick="loadDashboard()">
                <i class="fas fa-search"></i>
                Load Dashboard
            </button>
        </div>
    </div>

    <div id="dashboard-content">
        <div class="loading">
            <div class="spinner"></div>
            <h3>Please enter your Steam ID</h3>
            <p>We'll create a personalized dashboard for you</p>
        </div>
    </div>
</div>

<script>
    const baseUrl = '';
    let currentSteamId = '';

    async function loadDashboard() {
        const steamId = document.getElementById('steamIdInput').value.trim();

        if (!steamId) {
            alert('Please enter your Steam ID');
            return;
        }

        currentSteamId = steamId;
        showLoading();

        try {
            const response = await fetch(`${baseUrl}/api/dashboard/${steamId}`);

            if (!response.ok) {
                throw new Error('Failed to load dashboard');
            }

            const data = await response.json();
            renderDashboard(data);

        } catch (error) {
            console.error('Error:', error);
            showError();
        }
    }

    function showLoading() {
        document.getElementById('dashboard-content').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <h3>Creating your dashboard...</h3>
                <p>Please wait a moment</p>
            </div>
        `;
    }

    function showError() {
        document.getElementById('dashboard-content').innerHTML = `
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Unable to load dashboard</h3>
                <p>Please check your Steam ID or try again later</p>
            </div>
        `;
    }

    function renderDashboard(data) {
        const content = document.getElementById('dashboard-content');

        content.innerHTML = `
            <div class="dashboard-grid">
                <!-- Profile Summary -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-user"></i>
                        <h3>Profile Summary</h3>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value">${data.profileSummary.totalGames}</div>
                            <div class="stat-label">Total Games</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.profileSummary.totalPlaytime.toFixed(1)}h</div>
                            <div class="stat-label">Total Playtime</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.profileSummary.gamesPlayedRecently}</div>
                            <div class="stat-label">Recently Played</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.profileSummary.averagePlaytimePerGame.toFixed(1)}h</div>
                            <div class="stat-label">Average Playtime</div>
                        </div>
                    </div>
                </div>

                <!-- Preferred Tags -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-tags"></i>
                        <h3>Preferred Tags</h3>
                    </div>
                    <div class="tag-list">
                        ${data.topTags.slice(0, 8).map(tag => `
                            <span class="tag">${tag.tagName} (${tag.gameCount})</span>
                        `).join('')}
                    </div>
                    <div style="margin-top: 20px;">
                        <div style="margin-bottom: 10px;">
                            <strong>Top Preference: ${data.topTags[0]?.tagName || 'None'}</strong>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${data.topTags[0]?.preferenceScore || 0}%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Genre Distribution Chart -->
                <div class="dashboard-card wide-card">
                    <div class="card-header">
                        <i class="fas fa-chart-pie"></i>
                        <h3>Genre Distribution</h3>
                    </div>
                    <div class="chart-container">
                        <canvas id="genreChart"></canvas>
                    </div>
                </div>

                <!-- Monthly Activity -->
                <div class="dashboard-card wide-card">
                    <div class="card-header">
                        <i class="fas fa-chart-bar"></i>
                        <h3>Monthly Activity</h3>
                    </div>
                    <div class="chart-container">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>

                <!-- Library Statistics -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-gamepad"></i>
                        <h3>Library Analysis</h3>
                    </div>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value">${data.libraryStats.neverPlayed}</div>
                            <div class="stat-label">Never Played</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.libraryStats.shortPlayed}</div>
                            <div class="stat-label">Short Play</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.libraryStats.mediumPlayed}</div>
                            <div class="stat-label">Medium Play</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.libraryStats.longPlayed}</div>
                            <div class="stat-label">Long Play</div>
                        </div>
                    </div>
                </div>

                <!-- Top Played Games -->
                <div class="dashboard-card">
                    <div class="card-header">
                        <i class="fas fa-trophy"></i>
                        <h3>Most Played Games</h3>
                    </div>
                    <div class="game-list">
                        ${data.libraryStats.topPlayedGames.map(game => `
                            <div class="game-item">
                                <img src="${game.headerImage}" alt="${game.name}" class="game-image">
                                <div class="game-info">
                                    <div class="game-name">${game.name}</div>
                                    <div class="game-playtime">${game.playtimeHours.toFixed(1)} hours played</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Insights & Recommendations -->
                <div class="dashboard-card wide-card">
                    <div class="card-header">
                        <i class="fas fa-lightbulb"></i>
                        <h3>Personalized Insights</h3>
                    </div>
                    <div class="insight-list">
                        ${data.insights.map(insight => `
                            <div class="insight-item">
                                <div class="insight-title">${insight.title}</div>
                                <div class="insight-description">${insight.description}</div>
                                <a href="${insight.actionUrl}" class="insight-action">${insight.actionText}</a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;

        // Render charts
        setTimeout(() => {
            renderGenreChart(data.genreDistribution);
            renderActivityChart(data.monthlyActivity);
        }, 100);
    }

    function renderGenreChart(genreData) {
        const ctx = document.getElementById('genreChart');
        if (!ctx) return;

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: genreData.map(item => item.genre),
                datasets: [{
                    data: genreData.map(item => item.percentage),
                    backgroundColor: genreData.map(item => item.color),
                    borderWidth: 2,
                    borderColor: '#1a1a2e'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#b4b4c8',
                            padding: 20,
                            usePointStyle: true
                        }
                    }
                }
            }
        });
    }

    function renderActivityChart(activityData) {
        const ctx = document.getElementById('activityChart');
        if (!ctx) return;

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: activityData.map(item => item.month),
                datasets: [
                    {
                        label: 'Playtime (Hours)',
                        data: activityData.map(item => item.totalPlaytime),
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Games Played',
                        data: activityData.map(item => item.gamesPlayed),
                        borderColor: '#7c3aed',
                        backgroundColor: 'rgba(124, 58, 237, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#b4b4c8'
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#8b8ba3' },
                        grid: { color: '#333344' }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        ticks: { color: '#8b8ba3' },
                        grid: { color: '#333344' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        ticks: { color: '#8b8ba3' },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
    }

    // Search with Enter key
    document.getElementById('steamIdInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            loadDashboard();
        }
    });

    // Page load animation
    window.addEventListener('load', () => {
        const elements = document.querySelectorAll('.dashboard-card');
        elements.forEach((el, index) => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            setTimeout(() => {
                el.style.transition = 'all 0.6s ease';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, index * 100);
        });
    });
</script>
</body>
</html>
