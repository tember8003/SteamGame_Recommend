<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Game Recommend By Tags</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --secondary: #7c3aed;
      --accent: #f59e0b;
      --bg-primary: #0a0a0f;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #16213e;
      --bg-card: #1e1e2e;
      --border: #333344;
      --border-hover: #4a4a6a;
      --text-primary: #ffffff;
      --text-secondary: #b4b4c8;
      --text-muted: #8b8ba3;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --shadow: rgba(0, 0, 0, 0.3);
      --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      --gradient-card: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
    }

    body {
      background: var(--bg-primary);
      background-image:
              radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-card);
      border-bottom: 1px solid var(--border);
      padding: 0 15px;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: var(--gradient-primary);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      color: var(--primary);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 0.8rem;
    }

    .back-button:hover {
      background: var(--bg-tertiary);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 15px;
      padding: 15px;
      min-height: 0;
    }

    .left-panel {
      width: 350px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-height: 0;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .section-card {
      background: var(--gradient-card);
      border-radius: 10px;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .section-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .section-title i {
      color: var(--primary);
      font-size: 0.9rem;
    }

    .tags-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tags-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .tag-type-switcher {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 6px;
      padding: 3px;
      margin-bottom: 12px;
    }

    .tag-type-btn {
      flex: 1;
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 0.8rem;
    }

    .tag-type-btn.active {
      background: var(--primary);
      color: var(--bg-primary);
    }

    .tag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 6px;
    }

    .tag-item {
      position: relative;
    }

    .tag-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }

    .tag-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      min-height: 28px;
    }

    .tag-item:hover .tag-label {
      border-color: var(--primary);
      background: var(--bg-tertiary);
    }

    .tag-item input:checked + .tag-label {
      background: var(--primary);
      color: var(--bg-primary);
      border-color: var(--primary);
      font-weight: 600;
    }

    .controls-section {
      background: var(--gradient-card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 16px;
      flex-shrink: 0;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .control-item:hover {
      border-color: var(--border-hover);
    }

    .control-item label {
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .control-item input[type="number"] {
      width: 55px;
      padding: 3px 6px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.75rem;
    }

    .control-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .recommend-button {
      width: 100%;
      background: var(--gradient-primary);
      color: var(--bg-primary);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .recommend-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(0, 212, 255, 0.3);
    }

    .recommend-button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .recommend-button .loading-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 6px;
    }

    .recommend-button.loading .loading-spinner {
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-section {
      flex: 1;
      background: var(--gradient-card);
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .result-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .result-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      min-height: 0;
    }

    .game-card {
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .game-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .game-content {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 16px;
      align-items: start;
    }

    .game-image {
      border-radius: 6px;
      overflow: hidden;
    }

    .game-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    .game-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .game-info .app-id {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-bottom: 8px;
    }

    .game-info .description {
      color: var(--text-secondary);
      font-size: 0.8rem;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .review-section {
      background: var(--bg-secondary);
      border-radius: 6px;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid var(--border);
    }

    .review-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .stat-item {
      background: var(--bg-tertiary);
      padding: 6px;
      border-radius: 4px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-value {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .review-texts {
      margin-top: 10px;
    }

    .review-text-section {
      margin-bottom: 8px;
    }

    .review-text-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .review-text-header.positive {
      color: var(--success);
    }

    .review-text-header.negative {
      color: var(--error);
    }

    .review-text-content {
      font-size: 0.7rem;
      line-height: 1.4;
      color: var(--text-secondary);
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .review-text-preview {
      display: block;
    }

    .review-text-full {
      display: none;
    }

    .review-text-toggle {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.65rem;
      margin-top: 4px;
      padding: 2px 4px;
      border-radius: 3px;
      transition: all 0.2s ease;
    }

    .review-text-toggle:hover {
      background: var(--bg-tertiary);
    }

    .steam-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--primary);
      color: var(--bg-primary);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .steam-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
    }

    .used-tags {
      background: var(--bg-secondary);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .used-tags h4 {
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .used-tags .tag {
      display: inline-block;
      background: var(--primary);
      color: var(--bg-primary);
      padding: 3px 6px;
      border-radius: 10px;
      margin: 1px 3px 1px 0;
      font-size: 0.65rem;
      font-weight: 500;
    }

    .no-results {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-muted);
    }

    .no-results i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-content {
      text-align: center;
      color: var(--text-primary);
    }

    .loading-content .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 스크롤바 스타일링 */
    .tags-content::-webkit-scrollbar,
    .result-content::-webkit-scrollbar {
      width: 5px;
    }

    .tags-content::-webkit-scrollbar-track,
    .result-content::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 2px;
    }

    .tags-content::-webkit-scrollbar-thumb,
    .result-content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .tags-content::-webkit-scrollbar-thumb:hover,
    .result-content::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    @media (max-width: 1024px) {
      .main-content {
        flex-direction: column;
        gap: 12px;
      }

      .left-panel {
        width: 100%;
        flex-shrink: 1;
        max-height: 250px;
      }

      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }

      .game-content {
        grid-template-columns: 100px 1fr;
        gap: 12px;
      }

      .review-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .tag-search-container {
        position: relative;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 10px;
        transition: all 0.3s ease;
    }

    .tag-search-container:focus-within {
        border-color: var(--primary);
        background: var(--bg-tertiary);
    }

    .tag-search-container i.fa-search {
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-right: 8px;
    }

    .tag-search-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-primary);
        font-size: 0.85rem;
        padding: 8px 0;
    }

    .tag-search-input::placeholder {
        color: var(--text-muted);
    }

    .clear-search-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    .clear-search-btn:hover {
        color: var(--primary);
    }

    /* 숨겨진 태그 아이템 */
    .tag-item.hidden {
        display: none;
    }

    /* 검색 결과 없음 메시지 */
    .no-tags-found {
        text-align: center;
        padding: 20px;
        color: var(--text-muted);
        font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-content">
    <div class="spinner"></div>
    <h3>Finding games...</h3>
    <p>Please wait a moment</p>
  </div>
</div>

<div class="app-container">
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back to Home
      </a>
      <h1><i class="fas fa-gamepad"></i> Game Recommend</h1>
    </div>
  </header>

  <main class="main-content">
    <div class="left-panel">
      <div class="section-card tags-section">
        <div class="section-header">
          <h2 class="section-title">
            <i class="fas fa-tags"></i>
            Tag Selection
          </h2>
        </div>
        <div class="tags-content">
          <div class="tag-type-switcher">
            <button class="tag-type-btn active" data-type="selected">
              <i class="fas fa-plus"></i> Include
            </button>
            <button class="tag-type-btn" data-type="excluded">
              <i class="fas fa-minus"></i> Exclude
            </button>
          </div>

            <div class="tag-search-container">
                <i class="fas fa-search"></i>
                <input
                        type="text"
                        id="tag-search-input"
                        class="tag-search-input"
                        placeholder="Search tags..."
                />
                <button id="clear-search" class="clear-search-btn" style="display: none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

          <div class="tab-content active" id="selected-tags">
            <div class="tag-grid" id="random-tags-container"></div>
          </div>

          <div class="tab-content" id="excluded-tags">
            <div class="tag-grid" id="excluded-tags-container"></div>
          </div>
        </div>
      </div>

      <div class="controls-section">
        <div class="controls-grid">
          <div class="control-item">
            <label for="random-review">Min Reviews</label>
            <input type="number" id="random-review" value="1000" min="0" max="100000" />
          </div>
          <div class="control-item">
            <label for="random-korean">Korean Only</label>
            <input type="checkbox" id="random-korean" />
          </div>
          <div class="control-item">
            <label for="random-free">Free Only</label>
            <input type="checkbox" id="random-free" />
          </div>
        </div>
        <button id="btn-random" class="recommend-button">
          <span class="loading-spinner"></span>
          <i class="fas fa-magic"></i>
          Get Recommendations
        </button>
      </div>
    </div>

    <div class="right-panel">
      <div class="result-section">
        <div class="result-header">
          <h2 class="section-title">
            <i class="fas fa-star"></i>
            Game Recommendations
          </h2>
        </div>
        <div class="result-content" id="random-result">
          <div class="no-results">
            <i class="fas fa-gamepad"></i>
            <h3>Ready to find games</h3>
            <p>Select tags and click "Get Recommendations" to start!</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const tagsList = [
    "2D","3D","RPG","Action","Adventure","Casual","Indie","Strategy","Simulation",
    "Multiplayer","Singleplayer","Co-op","Early Access","Open World","Rich Story",
    "Puzzle","Platformer","Shooter","FPS","Third Person","VR","Fantasy","Sci-fi","Horror","Survival",
    "Anime","Visual Novel","Pixel Graphics","Turn-Based","Card Game","Sandbox",
    "Building","Crafting","Mystery","Comedy","Dark","Gore","Violent","Cute",
    "Psychological Horror","Detective","Zombie","Online Co-Op","Hack and Slash","Fighting","Beat 'em up",
    "Bullet Hell","Side Scroller","Roguelike","Roguelite","Action RPG","Action-Adventure",
    "MMO","JRPG","Dungeon Crawler","Match 3","Sports","Racing","First-Person","Third-Person Shooter",
    "Rhythm","Music","Management","Clicker","Tactical","Stealth","Exploration"
  ];

  const baseUrl = '';

  document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('tag-search-input');
      const clearBtn = document.getElementById('clear-search');
      const selectedContainer = document.getElementById('random-tags-container');
      const excludedContainer = document.getElementById('excluded-tags-container');

      // Create tags for both containers
      tagsList.forEach(tag => {
          // Selected tags
          const tagItem1 = document.createElement('div');
          tagItem1.className = 'tag-item';
          tagItem1.innerHTML = `
      <input type="checkbox" name="tags" value="${tag}" id="tag-${tag}" />
      <label for="tag-${tag}" class="tag-label">${tag}</label>
    `;
          selectedContainer.append(tagItem1);

          // Excluded tags (same styling)
          const tagItem2 = document.createElement('div');
          tagItem2.className = 'tag-item';
          tagItem2.innerHTML = `
      <input type="checkbox" name="excludedTags" value="${tag}" id="excluded-${tag}" />
      <label for="excluded-${tag}" class="tag-label">${tag}</label>
    `;
          excludedContainer.append(tagItem2);
      });

      // Tab switching functionality
      document.querySelectorAll('.tag-type-btn').forEach(btn => {
          btn.addEventListener('click', () => {
              const type = btn.dataset.type;

              // Update button states
              document.querySelectorAll('.tag-type-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');

              // Update tab content
              document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
              if (type === 'selected') {
                  document.getElementById('selected-tags').classList.add('active');
              } else {
                  document.getElementById('excluded-tags').classList.add('active');
              }

              // Retain search terms when switching tabs and re-apply filters
              filterTags(searchInput.value);
          });
      });

      // Tag search filtering function
      function filterTags(searchTerm) {
          const term = searchTerm.toLowerCase().trim();
          const activeTab = document.querySelector('.tag-type-btn.active').dataset.type;
          const container = activeTab === 'selected' ? selectedContainer : excludedContainer;
          const tagItems = container.querySelectorAll('.tag-item');

          let visibleCount = 0;

          tagItems.forEach(item => {
              const label = item.querySelector('.tag-label');
              const tagName = label.textContent.toLowerCase();

              if (tagName.includes(term)) {
                  item.classList.remove('hidden');
                  visibleCount++;
              } else {
                  item.classList.add('hidden');
              }
          });

          // No Search Results Message
          let noResultsMsg = container.querySelector('.no-tags-found');
          if (visibleCount === 0 && term !== '') {
              if (!noResultsMsg) {
                  noResultsMsg = document.createElement('div');
                  noResultsMsg.className = 'no-tags-found';
                  noResultsMsg.innerHTML = '<i class="fas fa-search"></i><br>No tags found';
                  container.appendChild(noResultsMsg);
              }
          } else {
              if (noResultsMsg) {
                  noResultsMsg.remove();
              }
          }

          // Clear Show/Hide buttons
          clearBtn.style.display = term ? 'flex' : 'none';
      }

      // Search Input Event
      searchInput.addEventListener('input', (e) => {
          filterTags(e.target.value);
      });

      // clear button
      clearBtn.addEventListener('click', () => {
          searchInput.value = '';
          filterTags('');
          searchInput.focus();
      });

      // Search with Enter key (prevent form submission)
      searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
              e.preventDefault();
          }
      });
  });

  document.getElementById('btn-random').addEventListener('click', async () => {
    const button = document.getElementById('btn-random');
    const loadingOverlay = document.getElementById('loading-overlay');

    // Start loading state
    button.classList.add('loading');
    loadingOverlay.classList.add('show');

    try {
      const tags = Array
              .from(document.querySelectorAll('#random-tags-container input[name="tags"]:checked'))
              .map(cb => cb.value);

      const excludedTags = Array
              .from(document.querySelectorAll('#excluded-tags-container input[name="excludedTags"]:checked'))
              .map(cb => cb.value);

      const body = {
        tags,
        review: +document.getElementById('random-review').value,
        korean_check: document.getElementById('random-korean').checked,
        free_check: document.getElementById('random-free').checked,
        excludedTag: excludedTags.length > 0 ? excludedTags : null
      };

      const res = await fetch(`${baseUrl}/api/recommend/random`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      setTimeout(() => {
        renderGameResult(data);
      }, 500);

    } catch (error) {
      console.error('Error:', error);
      renderErrorResult();
    } finally {
      setTimeout(() => {
        button.classList.remove('loading');
        loadingOverlay.classList.remove('show');
      }, 800);
    }
  });

  function renderGameResult(data, containerId = 'random-result') {
    const container = document.getElementById(containerId);

    let usedTags = [];
    let games = [];
    let reviews = [];

    if (Array.isArray(data)) {
      games = data;
    } else {
      usedTags = data.usedTags || [];
      games = data.recommendedGames || data.recommendedGame || [];
      reviews = data.review || [];
    }

    if (!Array.isArray(games) || games.length === 0) {
      container.innerHTML = `
        <div class="no-results">
          <i class="fas fa-search"></i>
          <h3>No games found</h3>
          <p>Try different tag combinations!</p>
        </div>
      `;
      return;
    }

    let html = '';

    if (usedTags.length > 0) {
      html += `
        <div class="used-tags">
          <h4><i class="fas fa-tags"></i> Used Tags</h4>
          <div>
            ${usedTags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </div>
      `;
    }

    games.forEach((game, index) => {
      const review = reviews[index] || {};

      html += `
        <div class="game-card">
          <div class="game-content">
            <div class="game-image">
              <img src="${game.headerImage}" alt="${game.name} header" />
            </div>
            <div class="game-info">
              <h3>${game.name}</h3>
              <p class="app-id">AppID: ${game.appid}</p>
              <p class="description">${game.shortDescription}</p>

              ${renderReviewSection(review, index)}

              <a href="${game.steamStore}" target="_blank" class="steam-link">
                <i class="fab fa-steam"></i>
                View on Steam
              </a>
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function renderReviewSection(review, gameIndex) {
    if (!review || Object.keys(review).length === 0) {
      return `
      <div class="review-section">
          <p style="color: var(--text-muted); text-align: center; font-size: 0.75rem;">
              No review data available
          </p>
      </div>
      `;
    }

    const positiveRating = review.positiveRating || 0;
    const reviewSummary = review.reviewSummary || 'No rating';
    const positiveHours = review.positiveHours || 0;
    const negativeHours = review.negativeHours || 0;
    const positiveReview = review.positiveReview || '';
    const negativeReview = review.negativeReview || '';

    let reviewTextsHtml = '';

    if (positiveReview || negativeReview) {
      reviewTextsHtml = '<div class="review-texts">';

      if (positiveReview) {
        const isLong = positiveReview.length > 150;
        const previewText = isLong ? positiveReview.substring(0, 150) + '...' : positiveReview;

        reviewTextsHtml += `
          <div class="review-text-section">
            <div class="review-text-header positive">
              <i class="fas fa-thumbs-up"></i>
              Positive Review
            </div>
            <div class="review-text-content">
              <span class="review-text-preview" id="pos-preview-${gameIndex}">${previewText}</span>
              <span class="review-text-full" id="pos-full-${gameIndex}">${positiveReview}</span>
              ${isLong ? `<button class="review-text-toggle" onclick="toggleReviewText('pos', ${gameIndex})">Show more</button>` : ''}
            </div>
          </div>
        `;
      }

      if (negativeReview) {
        const isLong = negativeReview.length > 150;
        const previewText = isLong ? negativeReview.substring(0, 150) + '...' : negativeReview;

        reviewTextsHtml += `
          <div class="review-text-section">
            <div class="review-text-header negative">
              <i class="fas fa-thumbs-down"></i>
              Negative Review
            </div>
            <div class="review-text-content">
              <span class="review-text-preview" id="neg-preview-${gameIndex}">${previewText}</span>
              <span class="review-text-full" id="neg-full-${gameIndex}">${negativeReview}</span>
              ${isLong ? `<button class="review-text-toggle" onclick="toggleReviewText('neg', ${gameIndex})">Show more</button>` : ''}
            </div>
          </div>
        `;
      }

      reviewTextsHtml += '</div>';
    }

    return `
    <div class="review-section">
        <div class="review-stats">
            <div class="stat-item">
                <span class="stat-value">${positiveRating}%</span>
                <div class="stat-label">Positive</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${reviewSummary}</span>
                <div class="stat-label">Rating</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${positiveHours}h</span>
                <div class="stat-label">Pos Hours</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${negativeHours}h</span>
                <div class="stat-label">Neg Hours</div>
            </div>
        </div>
        ${reviewTextsHtml}
    </div>
    `;
  }

  // Toggle review text function
  function toggleReviewText(type, gameIndex) {
    const preview = document.getElementById(`${type}-preview-${gameIndex}`);
    const full = document.getElementById(`${type}-full-${gameIndex}`);
    const button = event.target;

    if (preview.style.display !== 'none') {
      preview.style.display = 'none';
      full.style.display = 'block';
      button.textContent = 'Show less';
    } else {
      preview.style.display = 'block';
      full.style.display = 'none';
      button.textContent = 'Show more';
    }
  }

  // Make toggleReviewText available globally
  window.toggleReviewText = toggleReviewText;

  function renderErrorResult() {
    const container = document.getElementById('random-result');
    container.innerHTML = `
      <div class="no-results">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>An error occurred</h3>
        <p>Please try again later.</p>
      </div>
    `;
  }
</script>
</body>
</html>
