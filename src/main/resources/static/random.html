
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Game Recommend By Tags</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --secondary: #7c3aed;
      --accent: #f59e0b;
      --bg-primary: #0a0a0f;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #16213e;
      --bg-card: #1e1e2e;
      --border: #333344;
      --border-hover: #4a4a6a;
      --text-primary: #ffffff;
      --text-secondary: #b4b4c8;
      --text-muted: #8b8ba3;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --shadow: rgba(0, 0, 0, 0.3);
      --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      --gradient-card: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-primary);
      background-image:
              radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 0;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      background: var(--gradient-primary);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    }

    .header .subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      color: var(--primary);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 50px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      font-weight: 500;
      backdrop-filter: blur(10px);
    }

    .back-button:hover {
      background: var(--bg-tertiary);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
    }

    .main-content {
      display: grid;
      gap: 30px;
      margin-bottom: 40px;
    }

    .section-card {
      background: var(--gradient-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 30px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .section-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gradient-primary);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .section-card:hover::before {
      opacity: 1;
    }

    .section-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 20px 40px var(--shadow);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    .section-title i {
      color: var(--primary);
      font-size: 1.1rem;
    }

    .tag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .tag-item {
      position: relative;
      overflow: hidden;
    }

    .tag-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }

    .tag-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .tag-label::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gradient-primary);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .tag-item:hover .tag-label {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 212, 255, 0.2);
    }

    .tag-item input:checked + .tag-label {
      background: var(--primary);
      color: var(--bg-primary);
      border-color: var(--primary);
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
    }

    .tag-item input:checked + .tag-label::before {
      left: 0;
    }

    .excluded-tag input:checked + .tag-label {
      background: var(--error);
      border-color: var(--error);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
    }

    .controls {
      background: var(--gradient-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      align-items: center;
      margin-bottom: 30px;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .control-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-tertiary);
    }

    .control-item label {
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      flex: 1;
    }

    .control-item input[type="number"] {
      width: 80px;
      padding: 8px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .control-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .recommend-button {
      width: 100%;
      background: var(--gradient-primary);
      color: var(--bg-primary);
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .recommend-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 212, 255, 0.4);
    }

    .recommend-button:active {
      transform: translateY(0);
    }

    .recommend-button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .recommend-button .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    .recommend-button.loading .loading-spinner {
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-section {
      margin-top: 40px;
    }

    .game-card {
      background: var(--gradient-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 30px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-primary);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .game-card:hover::before {
      opacity: 1;
    }

    .game-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px var(--shadow);
    }

    .game-content {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 30px;
      align-items: start;
    }

    .game-image {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .game-image img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .game-image:hover img {
      transform: scale(1.05);
    }

    .game-info h3 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .game-info .app-id {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .game-info .description {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .review-section {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      border: 1px solid var(--border);
    }

    .review-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .review-header h4 {
      color: var(--primary);
      font-size: 1.1rem;
      margin: 0;
    }

    .review-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-item {
      background: var(--bg-tertiary);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-value {
      display: block;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .review-texts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .review-text-card {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .review-text-card h5 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .review-text-card.positive h5 {
      color: var(--success);
    }

    .review-text-card.negative h5 {
      color: var(--error);
    }

    .rating-bar {
      background: var(--bg-tertiary);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
      margin: 8px 0;
    }

    .rating-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--success) 0%, var(--primary) 100%);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .steam-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gradient-primary);
      color: var(--bg-primary);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .steam-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
    }

    .used-tags {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }

    .used-tags h4 {
      color: var(--primary);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .used-tags .tag {
      display: inline-block;
      background: var(--primary);
      color: var(--bg-primary);
      padding: 6px 12px;
      border-radius: 20px;
      margin: 4px 8px 4px 0;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      background: var(--gradient-card);
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .no-results i {
      font-size: 4rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .no-results h3 {
      font-size: 1.5rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .no-results p {
      color: var(--text-muted);
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-content {
      text-align: center;
      color: var(--text-primary);
    }

    .loading-content .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .review-text-content {
      position: relative;
    }

    .review-text-content.collapsed .full-text {
      display: none;
    }

    .review-text-content.expanded .short-text {
      display: none;
    }

    .show-more-btn, .show-less-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 8px;
      padding: 4px 0;
      text-decoration: underline;
      transition: color 0.3s ease;
    }

    .show-more-btn:hover, .show-less-btn:hover {
      color: var(--primary-dark);
    }

    .ellipsis {
      color: var(--text-muted);
    }

    .review-text-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .header h1 {
        font-size: 2rem;
      }

      .tag-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
      }

      .controls-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .game-content {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .game-image {
        max-width: 300px;
        margin: 0 auto;
      }

      .review-texts {
        grid-template-columns: 1fr;
      }

      .review-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-content">
    <div class="spinner"></div>
    <h3>Finding games...</h3>
    <p>Please wait a moment</p>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-gamepad"></i> Game Recommend</h1>
    <p class="subtitle">Select your desired tags and find the perfect games!</p>
    <a href="index.html" class="back-button">
      <i class="fas fa-arrow-left"></i>
      Back to Home
    </a>
  </div>

  <div class="main-content">
    <div class="section-card">
      <h2 class="section-title">
        <i class="fas fa-star"></i>
        Selected Tags
      </h2>
      <div class="tag-grid" id="random-tags-container"></div>
    </div>

    <div class="section-card">
      <h2 class="section-title">
        <i class="fas fa-ban"></i>
        Excluded Tags
      </h2>
      <div class="tag-grid excluded-tags" id="excluded-tags-container"></div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-grid">
      <div class="control-item">
        <label for="random-review">Review Count</label>
        <input type="number" id="random-review" value="0" min="0" max="1000000" />
      </div>
      <div class="control-item">
        <label for="random-korean">Korean Support Only</label>
        <input type="checkbox" id="random-korean" />
      </div>
      <div class="control-item">
        <label for="random-free">Free Games Only</label>
        <input type="checkbox" id="random-free" />
      </div>
    </div>
    <button id="btn-random" class="recommend-button">
      <span class="loading-spinner"></span>
      <i class="fas fa-magic"></i>
      Get Game Recommendations
    </button>
  </div>

  <div id="random-result" class="result-section"></div>
</div>

<script>
  const tagsList = [
    "2D","3D","RPG","Action","Adventure","Casual","Indie","Strategy","Simulation",
    "Multiplayer","Singleplayer","Co-op","Early Access","Open World","Rich Story",
    "Puzzle","Platformer","Shooter","FPS","Third Person","VR","Fantasy","Sci-fi","Horror","Survival",
    "Anime","Visual Novel","Pixel Graphics","Turn-Based","Card Game","Sandbox",
    "Building","Crafting","Mystery","Comedy","Dark","Gore","Violent","Cute",
    "Psychological Horror","Detective","Zombie","Online Co-Op","Hack and Slash","Fighting","Beat 'em up",
    "Bullet Hell","Side Scroller","Roguelike","Roguelite","Action RPG","Action-Adventure",
    "MMO","JRPG","Dungeon Crawler","Match 3","Sports","Racing","First-Person","Third-Person Shooter",
    "Rhythm","Music","Management","Clicker","Tactical","Stealth","Exploration"
  ];

  const baseUrl = '';

  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('random-tags-container');
    const excludedContainer = document.getElementById('excluded-tags-container');

    tagsList.forEach(tag => {
      // Selected tags
      const tagItem1 = document.createElement('div');
      tagItem1.className = 'tag-item';
      tagItem1.innerHTML = `
        <input type="checkbox" name="tags" value="${tag}" id="tag-${tag}" />
        <label for="tag-${tag}" class="tag-label">${tag}</label>
      `;
      container.append(tagItem1);

      // Excluded tags
      const tagItem2 = document.createElement('div');
      tagItem2.className = 'tag-item excluded-tag';
      tagItem2.innerHTML = `
        <input type="checkbox" name="excludedTags" value="${tag}" id="excluded-${tag}" />
        <label for="excluded-${tag}" class="tag-label">${tag}</label>
      `;
      excludedContainer.append(tagItem2);
    });

    // Tag selection animation effect
    document.addEventListener('change', (e) => {
      if (e.target.type === 'checkbox' && (e.target.name === 'tags' || e.target.name === 'excludedTags')) {
        const label = e.target.nextElementSibling;
        if (e.target.checked) {
          label.style.transform = 'scale(1.05)';
          setTimeout(() => {
            label.style.transform = '';
          }, 200);
        }
      }
    });
  });

  document.getElementById('btn-random').addEventListener('click', async () => {
    const button = document.getElementById('btn-random');
    const loadingOverlay = document.getElementById('loading-overlay');

    // Start loading state
    button.classList.add('loading');
    loadingOverlay.classList.add('show');

    try {
      const tags = Array
              .from(document.querySelectorAll('#random-tags-container input[name="tags"]:checked'))
              .map(cb => cb.value);

      const excludedTags = Array
              .from(document.querySelectorAll('#excluded-tags-container input[name="excludedTags"]:checked'))
              .map(cb => cb.value);

      const body = {
        tags,
        review: +document.getElementById('random-review').value,
        korean_check: document.getElementById('random-korean').checked,
        free_check: document.getElementById('random-free').checked,
        excludedTag: excludedTags.length > 0 ? excludedTags : null
      };

      const res = await fetch(`${baseUrl}/api/recommend/random`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      // Wait briefly before showing results (UX improvement)
      setTimeout(() => {
        renderGameResult(data);

        // Scroll to results
        document.getElementById('random-result').scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }, 500);

    } catch (error) {
      console.error('Error:', error);
      renderErrorResult();
    } finally {
      // End loading state
      setTimeout(() => {
        button.classList.remove('loading');
        loadingOverlay.classList.remove('show');
      }, 800);
    }
  });

  function renderGameResult(data, containerId = 'random-result') {
    const container = document.getElementById(containerId);

    let usedTags = [];
    let games = [];
    let reviews = [];

    if (Array.isArray(data)) {
      games = data;
    } else {
      usedTags = data.usedTags || [];
      games = data.recommendedGames || data.recommendedGame || [];
      reviews = data.review || [];
    }

    if (!Array.isArray(games) || games.length === 0) {
      container.innerHTML = `
        <div class="no-results">
          <i class="fas fa-search"></i>
          <h3>No games found</h3>
          <p>Try different tag combinations!</p>
        </div>
      `;
      return;
    }

    let html = '';

    if (usedTags.length > 0) {
      html += `
        <div class="used-tags">
          <h4><i class="fas fa-tags"></i> Used Tags</h4>
          <div>
            ${usedTags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </div>
      `;
    }

    games.forEach((game, index) => {
      const review = reviews[index] || {};

      html += `
        <div class="game-card">
          <div class="game-content">
            <div class="game-image">
              <img src="${game.headerImage}" alt="${game.name} header" />
            </div>
            <div class="game-info">
              <h3>${game.name}</h3>
              <p class="app-id">AppID: ${game.appid}</p>
              <p class="description">${game.shortDescription}</p>

              ${renderReviewSection(review)}

              <a href="${game.steamStore}" target="_blank" class="steam-link">
                <i class="fab fa-steam"></i>
                View on Steam
              </a>
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

    const cards = container.querySelectorAll('.game-card');
    cards.forEach((card, index) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      setTimeout(() => {
        card.style.transition = 'all 0.5s ease';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, index * 200);
    });
  }

  function renderReviewSection(review) {
    if (!review || Object.keys(review).length === 0) {
      return `
      <div class="review-section">
          <div class="review-header">
              <i class="fas fa-star"></i>
              <h4>Review Information</h4>
          </div>
          <p style="color: var(--text-muted); text-align: center; padding: 20px;">
              No review data available
          </p>
      </div>
      `;
    }

    const positiveRating = review.positiveRating || 0;
    const reviewSummary = review.reviewSummary || 'No rating';
    const positiveHours = review.positiveHours || 0;
    const negativeHours = review.negativeHours || 0;

    return `
    <div class="review-section">
        <div class="review-header">
            <i class="fas fa-star"></i>
            <h4>Review Information</h4>
        </div>

        <div class="review-stats">
            <div class="stat-item">
                <span class="stat-value">${positiveRating}%</span>
                <div class="stat-label">Positive Rating</div>
                <div class="rating-bar">
                    <div class="rating-fill" style="width: ${positiveRating}%"></div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${reviewSummary}</span>
                <div class="stat-label">Overall Rating</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${positiveHours}h</span>
                <div class="stat-label">Avg Positive Hours</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${negativeHours}h</span>
                <div class="stat-label">Avg Negative Hours</div>
            </div>
        </div>

        ${(review.positiveReview || review.negativeReview) ? `
        <div class="review-texts">
            ${review.positiveReview ? `
            <div class="review-text-card positive">
                <h5>
                    <i class="fas fa-thumbs-up"></i>
                    Positive Review
                </h5>
                ${renderReviewText(review.positiveReview, 'positive')}
            </div>
            ` : ''}

            ${review.negativeReview ? `
            <div class="review-text-card negative">
                <h5>
                    <i class="fas fa-thumbs-down"></i>
                    Negative Review
                </h5>
                ${renderReviewText(review.negativeReview, 'negative')}
            </div>
            ` : ''}
        </div>
        ` : ''}
    </div>
    `;
  }

  function renderReviewText(text, type) {
    if (!text) return '';

    const maxLength = 150; // 글자 수 제한
    const isLong = text.length > maxLength;
    const shortText = text.substring(0, maxLength);
    const uniqueId = `review-${type}-${Math.random().toString(36).substr(2, 9)}`;

    if (!isLong) {
      return `<p>${text}</p>`;
    }

    return `
      <div class="review-text-content collapsed" id="${uniqueId}">
        <p>
          <span class="short-text">${shortText}<span class="ellipsis">...</span></span>
          <span class="full-text">${text}</span>
        </p>
        <button class="show-more-btn" onclick="toggleReviewText('${uniqueId}')">
          <i class="fas fa-chevron-down"></i> Show more
        </button>
        <button class="show-less-btn" onclick="toggleReviewText('${uniqueId}')" style="display: none;">
          <i class="fas fa-chevron-up"></i> Show less
        </button>
      </div>
    `;
  }

  function toggleReviewText(id) {
    const container = document.getElementById(id);
    const showMoreBtn = container.querySelector('.show-more-btn');
    const showLessBtn = container.querySelector('.show-less-btn');

    if (container.classList.contains('collapsed')) {
      container.classList.remove('collapsed');
      container.classList.add('expanded');
      showMoreBtn.style.display = 'none';
      showLessBtn.style.display = 'inline-block';
    } else {
      container.classList.remove('expanded');
      container.classList.add('collapsed');
      showMoreBtn.style.display = 'inline-block';
      showLessBtn.style.display = 'none';
    }
  }

  function renderErrorResult() {
    const container = document.getElementById('random-result');
    container.innerHTML = `
      <div class="no-results">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>An error occurred</h3>
        <p>Please try again later.</p>
      </div>
    `;
  }
</script>
</body>
</html>
