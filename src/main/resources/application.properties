spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:steamgames}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:steam}
spring.datasource.password=${DB_PASSWORD:steam}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# API/DTO-mapping backend: entities are mapped to DTOs inside @Transactional
# service methods, so no lazy loading occurs during response rendering.
# Disable OSIV to release DB connections early and fail-fast on stray lazy access.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8888

# actuator 는 health 만 노출함 (모니터링용, 상세는 기본값대로 감춰 status 만 반환)
management.endpoints.web.exposure.include=health

steam.api.key=${STEAM_API_KEY:}
spring.ai.google.api-key=${GEMINI_API_KEY:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8888}

resilience4j.retry.instances.steamApi.max-attempts=3
resilience4j.retry.instances.steamApi.wait-duration=500ms
resilience4j.circuitbreaker.instances.steamApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.steamApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.steamApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.steamApi.wait-duration-in-open-state=10s

resilience4j.retry.instances.geminiApi.max-attempts=3
resilience4j.retry.instances.geminiApi.wait-duration=500ms
resilience4j.circuitbreaker.instances.geminiApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.geminiApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.geminiApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.geminiApi.wait-duration-in-open-state=10s

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

app.crawler.steamspy-base-url=https://steamspy.com/api.php
app.crawler.page-delay-ms=60000
app.crawler.max-pages=100
app.crawler.min-reviews=50
app.crawler.store-base-url=https://store.steampowered.com
app.crawler.detail-delay-ms=1500
app.crawler.daily-detail-batch-size=200
app.crawler.review-sample-max-chars=2000

# 임베딩 (gemini-embedding, dimension 은 V2 vector(N) 와 일치)
app.embedding.model=gemini-embedding-001
app.embedding.dimension=768
app.embedding.task-type=SEMANTIC_SIMILARITY
app.embedding.base-url=https://generativelanguage.googleapis.com/v1beta/models
app.embedding.batch-size=100
app.embedding.request-delay-ms=1000
app.embedding.description-max-chars=1000
app.embedding.candidate-pool-k=40
app.embedding.result-size=4

# Rate limit (IP당, 비싼 엔드포인트 3개만)
app.ratelimit.endpoints.input.capacity=10
app.ratelimit.endpoints.input.refill-tokens=10
app.ratelimit.endpoints.input.period-minutes=1
app.ratelimit.endpoints.profile.capacity=30
app.ratelimit.endpoints.profile.refill-tokens=30
app.ratelimit.endpoints.profile.period-minutes=1
app.ratelimit.endpoints.recent-play.capacity=30
app.ratelimit.endpoints.recent-play.refill-tokens=30
app.ratelimit.endpoints.recent-play.period-minutes=1
# 피드백은 단건 insert(가벼움) + 카드마다 클릭 가능 → 넉넉히
app.ratelimit.endpoints.feedback.capacity=120
app.ratelimit.endpoints.feedback.refill-tokens=120
app.ratelimit.endpoints.feedback.period-minutes=1

# 신뢰 프록시 뒤에서만 X-Forwarded-For 반영 (스푸핑 차단). 프록시 없으면 실제 remoteAddr 로 폴백
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# Caddy 서브넷만 신뢰 프록시로 고정해 X-Forwarded-For 스푸핑을 차단함 (로컬 직접 실행은 프록시가 없어 값 무관함)
server.tomcat.remoteip.internal-proxies=${APP_TRUSTED_PROXIES:172\\.28\\..*}