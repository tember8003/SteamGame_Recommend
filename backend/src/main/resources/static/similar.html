<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Similar Game Recommendation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-card: #1e1e2e;
            --border: #333344;
            --border-hover: #4a4a6a;
            --text-primary: #ffffff;
            --text-secondary: #b4b4c8;
            --text-muted: #8b8ba3;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow: rgba(0, 0, 0, 0.3);
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            --gradient-card: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background: var(--bg-primary);
            background-image:
                    radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-card);
            border-bottom: 1px solid var(--border);
            padding: 0 15px;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            color: var(--primary);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .back-button:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            gap: 15px;
            padding: 15px;
            min-height: 0;
        }

        .left-panel {
            width: 400px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .section-card {
            background: var(--gradient-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .section-title i {
            color: var(--primary);
            font-size: 0.9rem;
        }

        .search-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .search-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .warning-text {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            border-radius: 6px;
            padding: 8px;
            color: var(--warning);
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .input-group {
            position: relative;
            flex-shrink: 0;
        }

        .input-text {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .input-text:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }

        .input-text::placeholder {
            color: var(--text-muted);
        }

        .autocomplete-items {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        .autocomplete-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.2s ease;
            border-bottom: 1px solid var(--border);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item img {
            width: 28px;
            height: 16px;
            object-fit: cover;
            margin-right: 8px;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .autocomplete-item:hover {
            background: var(--bg-tertiary);
        }

        .autocomplete-item span {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .controls-section {
            background: var(--gradient-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 16px;
            flex-shrink: 0;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .control-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .control-item:hover {
            border-color: var(--border-hover);
        }

        .control-item label {
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .control-item input[type="number"] {
            width: 55px;
            padding: 3px 6px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.75rem;
        }

        .control-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .recommend-button {
            width: 100%;
            background: var(--gradient-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .recommend-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 212, 255, 0.3);
        }

        .recommend-button.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .recommend-button .loading-spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }

        .recommend-button.loading .loading-spinner {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            flex: 1;
            background: var(--gradient-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .result-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .result-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            min-height: 0;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .game-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .game-content {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 16px;
            align-items: start;
        }

        .game-image {
            border-radius: 6px;
            overflow: hidden;
        }

        .game-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .game-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .game-info .app-id {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-bottom: 8px;
        }

        .game-info .description {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .review-section {
            background: var(--bg-secondary);
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid var(--border);
        }

        .review-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .stat-item {
            background: var(--bg-tertiary);
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .rating-bar {
            background: var(--bg-tertiary);
            border-radius: 15px;
            height: 4px;
            overflow: hidden;
            margin: 4px 0;
        }

        .rating-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, var(--primary) 100%);
            border-radius: 15px;
            transition: width 0.3s ease;
        }

        .steam-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--primary);
            color: var(--bg-primary);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .steam-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        .used-tags {
            background: var(--bg-secondary);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .used-tags h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .used-tags .tag {
            display: inline-block;
            background: var(--primary);
            color: var(--bg-primary);
            padding: 3px 6px;
            border-radius: 10px;
            margin: 1px 3px 1px 0;
            font-size: 0.65rem;
            font-weight: 500;
        }

        .no-results {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
        }

        .no-results i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: var(--text-primary);
        }

        .loading-content .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        /* 스크롤바 스타일링 */
        .result-content::-webkit-scrollbar,
        .autocomplete-items::-webkit-scrollbar {
            width: 5px;
        }

        .result-content::-webkit-scrollbar-track,
        .autocomplete-items::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 2px;
        }

        .result-content::-webkit-scrollbar-thumb,
        .autocomplete-items::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .result-content::-webkit-scrollbar-thumb:hover,
        .autocomplete-items::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
                gap: 12px;
            }

            .left-panel {
                width: 100%;
                flex-shrink: 1;
                max-height: 250px;
            }

            .game-content {
                grid-template-columns: 100px 1fr;
                gap: 12px;
            }

            .autocomplete-items {
                max-height: 150px;
            }
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loading-overlay">
    <div class="loading-content">
        <div class="spinner"></div>
        <h3>Finding similar games...</h3>
        <p>Please wait a moment</p>
    </div>
</div>

<div class="app-container">
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
            <h1><i class="fas fa-puzzle-piece"></i> Similar Game Finder</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="left-panel">
            <div class="section-card search-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <i class="fas fa-search"></i>
                        Game Search
                    </h2>
                </div>
                <div class="search-content">
                    <div class="warning-text">
                        <i class="fas fa-info-circle"></i>
                        Enter a game name and select from the autocomplete list
                    </div>
                    <div class="input-group">
                        <input
                                type="text"
                                id="similar-name"
                                class="input-text"
                                placeholder="Enter game name for recommendations"
                                autocomplete="off"
                        />
                        <div id="autocomplete-items" class="autocomplete-items"></div>
                    </div>
                </div>
            </div>

            <div class="controls-section">
                <div class="controls-grid">
                    <div class="control-item">
                        <label for="input-review">Min Reviews</label>
                        <input type="number" id="input-review" value="1000" min="0" max="100000" />
                    </div>
                    <div class="control-item">
                        <label for="input-korean">Korean Only</label>
                        <input type="checkbox" id="input-korean" />
                    </div>
                    <div class="control-item">
                        <label for="input-free">Free Only</label>
                        <input type="checkbox" id="input-free" />
                    </div>
                </div>
                <button id="btn-similar" class="recommend-button">
                    <span class="loading-spinner"></span>
                    <i class="fas fa-search"></i>
                    Get Recommendations
                </button>
            </div>
        </div>

        <div class="right-panel">
            <div class="result-section">
                <div class="result-header">
                    <h2 class="section-title">
                        <i class="fas fa-star"></i>
                        Similar Games
                    </h2>
                </div>
                <div class="result-content" id="similar-result">
                    <div class="no-results">
                        <i class="fas fa-puzzle-piece"></i>
                        <h3>Ready to find similar games</h3>
                        <p>Search for a game to get recommendations based on similar tags and features!</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const baseUrl = '';

    const inputEl = document.getElementById('similar-name');
    const listContainer = document.getElementById('autocomplete-items');
    const button = document.getElementById('btn-similar');
    const loadingOverlay = document.getElementById('loading-overlay');
    let debounceTimer = null;

    // Autocomplete functionality
    inputEl.addEventListener('input', function() {
        const query = this.value.trim();
        clearTimeout(debounceTimer);

        if (query.length < 2) {
            listContainer.innerHTML = '';
            return;
        }

        debounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`${baseUrl}/api/games/search?query=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error('Search failed');
                const list = await res.json();
                renderAutocomplete(list);
            } catch (err) {
                console.error(err);
                listContainer.innerHTML = '';
            }
        }, 300);
    });

    function renderAutocomplete(items) {
        listContainer.innerHTML = '';
        if (!Array.isArray(items) || items.length === 0) return;

        items.forEach(item => {
            const div = document.createElement('div');
            div.classList.add('autocomplete-item');
            div.innerHTML = `
                <img src="${item.headerImage}" alt="Thumbnail" />
                <span>${item.gameName}</span>
            `;
            div.addEventListener('click', () => {
                inputEl.value = item.gameName;
                listContainer.innerHTML = '';
            });
            listContainer.appendChild(div);
        });
    }

    // Close autocomplete on outside click
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.input-group')) {
            listContainer.innerHTML = '';
        }
    });

    // Search with Enter key
    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            button.click();
        }
    });

    // Recommendation button click
    button.addEventListener('click', async () => {
        const gameName = inputEl.value.trim();

        // Input validation
        if (!gameName) {
            inputEl.focus();
            inputEl.style.borderColor = 'var(--error)';
            setTimeout(() => {
                inputEl.style.borderColor = '';
            }, 2000);
            return;
        }

        // Start loading state
        button.classList.add('loading');
        loadingOverlay.classList.add('show');

        try {
            const body = {
                gameName,
                review: +document.getElementById('input-review').value,
                korean_check: document.getElementById('input-korean').checked,
                free_check: document.getElementById('input-free').checked
            };

            const res = await fetch(`${baseUrl}/api/recommend/similar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!res.ok) throw new Error('Recommendation request failed');
            const data = await res.json();

            setTimeout(() => {
                renderGameResult(data);
            }, 500);

        } catch (error) {
            console.error('Error:', error);
            renderErrorResult();
        } finally {
            setTimeout(() => {
                button.classList.remove('loading');
                loadingOverlay.classList.remove('show');
            }, 1000);
        }
    });

    function renderGameResult(data, containerId = 'similar-result') {
        const container = document.getElementById(containerId);

        let usedTags = [];
        let games = [];
        let reviews = [];

        if (Array.isArray(data)) {
            games = data;
        } else {
            usedTags = data.usedTags || [];
            games = data.recommendedGame || data.recommendedGames || [];
            reviews = data.review || [];
        }

        if (!Array.isArray(games) || games.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-puzzle-piece"></i>
                    <h3>No games found</h3>
                    <p>Please check the game name or try a different game!</p>
                </div>
            `;
            return;
        }

        let html = '';

        if (usedTags.length > 0) {
            html += `
                <div class="used-tags">
                    <h4><i class="fas fa-tags"></i> Analyzed Tags</h4>
                    <div>
                        ${usedTags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `;
        }

        games.forEach((game, index) => {
            const review = reviews[index] || {};

            html += `
                <div class="game-card">
                    <div class="game-content">
                        <div class="game-image">
                            <img src="${game.headerImage}" alt="${game.name} header" />
                        </div>
                        <div class="game-info">
                            <h3>${game.name}</h3>
                            <p class="app-id">AppID: ${game.appid}</p>
                            <p class="description">${game.shortDescription}</p>

                            ${renderReviewSection(review)}

                            <div class="feedback-row" style="display:flex;gap:8px;margin:8px 0">
                                <button type="button" class="fb-up" onclick="sgrFeedback(${game.appid},'UP','SIMILAR',${index},null);this.style.opacity=1;this.nextElementSibling.style.opacity=0.4">👍</button>
                                <button type="button" class="fb-down" onclick="sgrFeedback(${game.appid},'DOWN','SIMILAR',${index},null);this.style.opacity=1;this.previousElementSibling.style.opacity=0.4">👎</button>
                            </div>

                            <a href="${game.steamStore}" target="_blank" class="steam-link" onclick="sgrFeedback(${game.appid},'CLICK','SIMILAR',${index},null)">
                                <i class="fab fa-steam"></i>
                                View on Steam
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function renderReviewSection(review) {
        if (!review || Object.keys(review).length === 0) {
            return `
        <div class="review-section">
            <p style="color: var(--text-muted); text-align: center; font-size: 0.75rem;">
                No review data available
            </p>
        </div>
        `;
        }

        const positiveRating = review.positiveRating || 0;
        const reviewSummary = review.reviewSummary || 'No rating';
        const positiveHours = review.positiveHours || 0;
        const negativeHours = review.negativeHours || 0;

        return `
    <div class="review-section">
        <div class="review-stats">
            <div class="stat-item">
                <span class="stat-value">${positiveRating}%</span>
                <div class="stat-label">Positive</div>
                <div class="rating-bar">
                    <div class="rating-fill" style="width: ${positiveRating}%"></div>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${reviewSummary}</span>
                <div class="stat-label">Rating</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${positiveHours}h</span>
                <div class="stat-label">Pos Hours</div>
            </div>
            <div class="stat-item">
                <span class="stat-value">${negativeHours}h</span>
                <div class="stat-label">Neg Hours</div>
            </div>
        </div>
    </div>
    `;
    }

    function renderErrorResult() {
        const container = document.getElementById('similar-result');
        container.innerHTML = `
            <div class="no-results">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>An error occurred</h3>
                <p>Please check the game name or try again later.</p>
            </div>
        `;
    }
</script>
<script src="/feedback.js"></script>
</body>
</html>
