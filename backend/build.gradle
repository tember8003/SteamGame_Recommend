plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'SteamGame'
version = '0.0.1-SNAPSHOT'

// Boot 3.4 시절 CVE 때문에 직접 올리던 netty, jackson, spring-framework, commons-lang3, assertj 버전 고정은 지웠다
// Boot 4.1.3 BOM 기본값이 그때 고정값보다 모두 새 버전이다

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Database - PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway (schema migrations)
	// Boot 4 부터 Flyway 자동 설정이 별도 모듈이라 flyway-core 만 두면 마이그레이션이 돌지 않는다, 스타터로 받는다
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Spring Boot Core
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 외부 API 호출에 WebClient 만 쓴다, 리액티브 서버까지 끌어오는 webflux 스타터 대신 클라이언트 스타터
	implementation 'org.springframework.boot:spring-boot-starter-webclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Actuator (health 엔드포인트)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Resilience4j
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

	// Environment Management
	implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'

	// Rate Limiting
	implementation 'com.bucket4j:bucket4j-core:8.3.0'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test dependencies
	// Boot 4 는 테스트 슬라이스도 기술별 모듈로 나뉘었다(@WebMvcTest, @DataJpaTest, @JdbcTest)
	// JUnit, Mockito 버전은 BOM 에 맡긴다, 예전처럼 5.9.3, 5.3.1 로 고정하면 BOM 의 JUnit 6 과 섞인다
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	// @WebMvcTest 에 SecurityConfig 가 올라가려면 보안 테스트 모듈이 있어야 한다
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveFileName = 'recommend-0.0.1-SNAPSHOT.jar'
	enabled = true
}

jar {
	enabled = false
}