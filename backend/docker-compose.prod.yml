services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sgr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/tember8003/recommend:latest
    container_name: sgr-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      JAVA_TOOL_OPTIONS: "-Xmx768m"
      # Caddy 서브넷만 신뢰 프록시로 고정함 (compose 네트워크 172.28.0.0/16 과 일치)
      APP_TRUSTED_PROXIES: '172\.28\..*'
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8888"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 태그 구조 임베딩 학습 배치, 서버에서 빌드한 이미지를 docker compose run --rm tagemb 로만 실행한다
  # batch 프로필이라 배포의 up -d 에는 뜨지 않는다
  tagemb:
    image: sgr-tagemb:latest
    container_name: sgr-tagemb
    profiles: ["batch"]
    depends_on:
      postgres:
        condition: service_healthy
    # 앱의 다른 비밀값은 넘기지 않고 DB 접속값만 준다
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # cpus 1.5 에서는 스레드 1개일 때 학습이 더 빠르다
      OMP_NUM_THREADS: "1"
    # 학습 중에도 앱이 응답하게 CPU 와 메모리를 남긴다
    cpus: "1.5"
    mem_limit: 3g
    networks:
      - appnet

  caddy:
    image: caddy:2
    container_name: sgr-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  caddy_data:
  caddy_config:
