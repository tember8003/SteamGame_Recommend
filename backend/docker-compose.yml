services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: steamgames-postgres
    environment:
      POSTGRES_DB: steamgames
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: steam
    ports:
      - "5432:5432"
    volumes:
      - steamgames_pgdata:/var/lib/postgresql/data

volumes:
  steamgames_pgdata:
